name: CarPlayLyrics
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  LyricsCore:
    path: Packages/LyricsCore
targets:
  CarPlayLyrics:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: Shared
      - path: App/Resources
      - path: PRIVACY.md
        buildPhase: resources
      - path: TERMS.md
        buildPhase: resources
      - path: App/Support
        buildPhase: none
    dependencies:
      - package: LyricsCore
      - target: LyricsWidget
      - sdk: CarPlay.framework
    settings:
      base:
        PRODUCT_NAME: CarPlayLyrics
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).carplaylyrics
        INFOPLIST_FILE: App/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # The CarPlay entitlement only on the Simulator: Apple won't grant it for a lyrics app,
        # and a device build that asks for it can't be signed.
        CODE_SIGN_ENTITLEMENTS: App/Support/CarPlayLyrics.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/Support/CarPlayLyrics-Simulator.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LyricsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - package: LyricsCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: LyricsWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).carplaylyrics.widget
        INFOPLIST_FILE: Widget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  CarPlayLyricsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: CarPlayLyrics
      - package: LyricsCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).carplaylyrics.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CarPlayLyrics.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CarPlayLyrics
        BUNDLE_LOADER: $(TEST_HOST)
  CarPlayLyricsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: CarPlayLyrics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).carplaylyrics.uitests
        TEST_TARGET_NAME: CarPlayLyrics
schemes:
  CarPlayLyrics:
    build:
      targets:
        CarPlayLyrics: all
        LyricsWidget: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - CarPlayLyrics
      targets:
        - CarPlayLyricsTests
        - CarPlayLyricsUITests
    archive:
      config: Release
