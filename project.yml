name: CarPlayLyrics
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  LyricsCore:
    path: Packages/LyricsCore
targets:
  CarPlayLyrics:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: App/Support
        buildPhase: none
    dependencies:
      - package: LyricsCore
      - sdk: CarPlay.framework
    settings:
      base:
        PRODUCT_NAME: CarPlayLyrics
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).carplaylyrics
        INFOPLIST_FILE: App/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Support/CarPlayLyrics.entitlements
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  CarPlayLyrics:
    build:
      targets:
        CarPlayLyrics: all
    run:
      config: Debug
    archive:
      config: Release
