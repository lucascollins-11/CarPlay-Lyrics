name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (LyricsCore)
        working-directory: Packages/LyricsCore
        run: swift test

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app for the Simulator
        run: |
          xcodebuild build \
            -project CarPlayLyrics.xcodeproj \
            -scheme CarPlayLyrics \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
